<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e8590c">
  <title>運動管理</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/app-icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-row">
      <h1>運動管理</h1>
      <span id="save-status" role="status">—</span>
    </div>
    <div class="date-nav">
      <button id="prev-day" type="button" aria-label="前の日">◀</button>
      <input type="date" id="current-date" aria-label="表示中の日付">
      <button id="next-day" type="button" aria-label="次の日">▶</button>
    </div>
  </header>

  <main>
    <section class="view" id="view-record">
    <form id="record-form" autocomplete="off">
      <section class="card card-jogging">
        <h2>ジョギング</h2>
        <div class="field-grid">
          <label>距離
            <span class="input-unit"><input type="number" id="distanceKm" min="0" step="0.1" inputmode="decimal" placeholder="0.0"><span>km</span></span>
          </label>
          <label>時間
            <span class="input-unit"><input type="number" id="durationMin" min="0" inputmode="numeric" placeholder="0"><span>分</span></span>
          </label>
        </div>
      </section>

      <section class="card card-strength">
        <h2>基本の筋力トレーニング<span class="unit-note">回数</span></h2>
        <div class="field-grid">
          <label>腹筋の回数
            <span class="input-unit"><input type="number" id="situps" min="0" inputmode="numeric" placeholder="0"><span>回</span></span>
          </label>
          <label>背筋の回数
            <span class="input-unit"><input type="number" id="backExtensions" min="0" inputmode="numeric" placeholder="0"><span>回</span></span>
          </label>
          <label>スクワットの回数
            <span class="input-unit"><input type="number" id="squats" min="0" inputmode="numeric" placeholder="0"><span>回</span></span>
          </label>
          <label>ハンドグリップ
            <span class="input-unit"><input type="number" id="gripReps" min="0" inputmode="numeric" placeholder="0"><span>回</span></span>
          </label>
        </div>
        <div class="pushup-block">
          <div class="pushup-head">
            <span>腕立て伏せの回数</span>
            <span class="pushup-total-chip">合計(自動) <strong id="pushup-total">0</strong> 回</span>
          </div>
          <div class="pushup-sets">
            <label>1回目<input type="number" id="pushups1" min="0" inputmode="numeric" placeholder="0"></label>
            <label>2回目<input type="number" id="pushups2" min="0" inputmode="numeric" placeholder="0"></label>
            <label>3回目<input type="number" id="pushups3" min="0" inputmode="numeric" placeholder="0"></label>
          </div>
        </div>
      </section>

      <section class="card card-grip">
        <h2>ハンドグリップ<span class="unit-note">握力測定</span></h2>
        <div class="field-grid">
          <label>左手 握力
            <span class="input-unit"><input type="number" id="leftKg" min="0" step="0.1" inputmode="decimal" placeholder="0.0"><span>kg</span></span>
          </label>
          <label>右手 握力
            <span class="input-unit"><input type="number" id="rightKg" min="0" step="0.1" inputmode="decimal" placeholder="0.0"><span>kg</span></span>
          </label>
        </div>
      </section>

      <section class="card card-memo">
        <h2>メモ</h2>
        <textarea id="memo" rows="4" placeholder="体調や気づいたことなど"></textarea>
      </section>
    </form>
    </section>

    <section class="view hidden" id="view-timeline">
      <div id="timeline-container"></div>
    </section>

    <section class="view hidden" id="view-settings">
      <section class="card card-settings" id="sync-backup-section">
        <p class="settings-note">読み込み中です...</p>
      </section>
      <section class="card card-settings" id="sync-token-section">
        <p class="settings-note">読み込み中です...</p>
      </section>
      <section class="card card-settings">
        <h2>インポート・エクスポート</h2>
        <p class="settings-note">アプリのデータをJSONファイルに書き出したり、ファイルから取り込んだりできます。</p>
        <div class="data-file-row">
          <button id="export-file" type="button">ファイルにエクスポート</button>
          <button id="import-file" type="button">ファイルからインポート</button>
        </div>
        <input type="file" id="import-file-input" accept="application/json" hidden>
        <p class="settings-note" id="file-message" role="status"></p>
      </section>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn is-active" data-view="record" type="button">記録</button>
    <button class="nav-btn" data-view="timeline" type="button">時系列</button>
    <button class="nav-btn" data-view="settings" type="button">設定</button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
